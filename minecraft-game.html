<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft-like Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #87CEEB; font-family: Arial, sans-serif; }
#canvas { display: block; cursor: crosshair; }
#ui { position: fixed; top: 10px; left: 10px; color: #fff; font-size: 14px; text-shadow: 1px 1px 2px #000; pointer-events: none; }
#crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 24px; pointer-events: none; text-shadow: 1px 1px 2px #000; }
#hotbar { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
.slot { width: 50px; height: 50px; background: rgba(0,0,0,0.6); border: 2px solid #555; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #fff; font-size: 10px; position: relative; }
.slot.selected { border-color: #fff; }
.slot-count { font-size: 12px; position: absolute; bottom: 2px; right: 4px; }
#inventory { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border: 3px solid #555; display: none; z-index: 100; max-height: 80vh; overflow-y: auto; }
#inventory h3 { color: #fff; margin-bottom: 10px; }
#inv-grid { display: grid; grid-template-columns: repeat(9, 45px); gap: 2px; margin-bottom: 20px; }
.craft-btn { background: #4a4; color: #fff; border: none; padding: 8px 15px; cursor: pointer; margin: 3px; font-size: 12px; }
.craft-btn:hover { background: #5b5; }
.craft-btn:disabled { background: #555; cursor: not-allowed; }
#health-bar { position: fixed; top: 10px; right: 10px; display: flex; gap: 2px; }
.heart { width: 18px; height: 18px; background: #f00; border-radius: 2px; }
.heart.empty { background: #500; }
#message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 32px; text-shadow: 2px 2px 4px #000; display: none; }
#instructions { position: fixed; bottom: 80px; left: 10px; color: #fff; font-size: 11px; text-shadow: 1px 1px 2px #000; opacity: 0.8; }
#mining-bar { position: fixed; top: 60%; left: 50%; transform: translateX(-50%); width: 100px; height: 5px; background: #333; display: none; }
#mining-progress { height: 100%; background: #0f0; width: 0%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
    <div>Pos: <span id="pos">0, 0, 0</span></div>
    <div>Biome: <span id="biome">-</span></div>
</div>
<div id="crosshair">+</div>
<div id="hotbar"></div>
<div id="health-bar"></div>
<div id="mining-bar"><div id="mining-progress"></div></div>
<div id="inventory">
    <h3>Inventory [E]</h3>
    <div id="inv-grid"></div>
    <h3>Crafting</h3>
    <div id="craft-buttons"></div>
</div>
<div id="message"></div>
<div id="instructions">
WASD:Move SPACE:Jump Mouse:Look<br>
LClick:Mine/Attack RClick:Place/Eat E:Inventory
</div>

<script>
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

var BLOCKS = { AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, LOG: 4, LEAVES: 5, WATER: 6, SAND: 7, IRON_ORE: 8, FLOWER_RED: 9, FLOWER_YELLOW: 10, TALL_GRASS: 11, PLANKS: 12, CRAFTING_TABLE: 13, BED: 14, GLASS: 15 };
var BLOCK_COLORS = { 1: '#4a9', 2: '#864', 3: '#888', 4: '#653', 5: '#2a5', 6: '#48f', 7: '#dc9', 8: '#876', 9: '#f44', 10: '#ff4', 11: '#3a6', 12: '#b95', 13: '#965', 14: '#c55', 15: '#aef' };
var SOLID_BLOCKS = { 1:1, 2:1, 3:1, 4:1, 5:1, 7:1, 8:1, 12:1, 13:1, 14:1, 15:1 };

var ITEMS = { wood:'wood', stone:'stone', iron:'iron', dirt:'dirt', wood_axe:'wood_axe', wood_sword:'wood_sword', wood_pickaxe:'wood_pickaxe', stone_axe:'stone_axe', stone_sword:'stone_sword', stone_pickaxe:'stone_pickaxe', iron_axe:'iron_axe', iron_sword:'iron_sword', iron_pickaxe:'iron_pickaxe', crafting_table:'crafting_table', akm:'akm', flower:'flower', pork:'pork' };
var ITEM_COLORS = { wood:'#853', stone:'#888', iron:'#bbb', dirt:'#864', wood_axe:'#963', wood_sword:'#963', wood_pickaxe:'#963', stone_axe:'#999', stone_sword:'#999', stone_pickaxe:'#999', iron_axe:'#ccc', iron_sword:'#ccc', iron_pickaxe:'#ccc', crafting_table:'#965', akm:'#333', flower:'#f6a', pork:'#faa' };
var ITEM_NAMES = { wood:'Wood', stone:'Stone', iron:'Iron', dirt:'Dirt', wood_axe:'WoodAxe', wood_sword:'WoodSword', wood_pickaxe:'WoodPick', stone_axe:'StoneAxe', stone_sword:'StoneSword', stone_pickaxe:'StonePick', iron_axe:'IronAxe', iron_sword:'IronSword', iron_pickaxe:'IronPick', crafting_table:'CraftTable', akm:'AKM', flower:'Flower', pork:'Pork' };

var RECIPES = [
    { result:'crafting_table', count:1, cost:{wood:4}, needsTable:false },
    { result:'wood_axe', count:1, cost:{wood:2}, needsTable:true },
    { result:'wood_sword', count:1, cost:{wood:3}, needsTable:true },
    { result:'wood_pickaxe', count:1, cost:{wood:3}, needsTable:true },
    { result:'stone_axe', count:1, cost:{stone:2}, needsTable:true },
    { result:'stone_sword', count:1, cost:{stone:3}, needsTable:true },
    { result:'stone_pickaxe', count:1, cost:{stone:3}, needsTable:true },
    { result:'iron_axe', count:1, cost:{iron:2}, needsTable:true },
    { result:'iron_sword', count:1, cost:{iron:3}, needsTable:true },
    { result:'iron_pickaxe', count:1, cost:{iron:3}, needsTable:true },
    { result:'akm', count:1, cost:{iron:4}, needsTable:true }
];

var CHUNK_SIZE = 16, WORLD_HEIGHT = 48, RENDER_DIST = 20, SEA_LEVEL = 16;
var chunks = {}, mobs = [], drops = [];

var player = { x:0, y:20, z:0, vx:0, vy:0, vz:0, yaw:0, pitch:0, onGround:false, health:10, maxHealth:10, inventory:[], slot:0, nearTable:false };
for (var i = 0; i < 36; i++) player.inventory.push(null);
player.inventory[0] = { item:'wood', count:10 };
player.inventory[1] = { item:'wood_pickaxe', count:1 };

var keys = {}, mouseLeft = false, mouseRight = false, mouseLocked = false, invOpen = false;
var miningTarget = null, miningTime = 0;

// Simple noise
function hash(x, y, seed) { var n = Math.sin(x * 127.1 + y * 311.7 + seed) * 43758.5453; return n - Math.floor(n); }
function noise(x, y, seed) {
    var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    var a = hash(ix, iy, seed), b = hash(ix+1, iy, seed), c = hash(ix, iy+1, seed), d = hash(ix+1, iy+1, seed);
    var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    return a + (b-a)*ux + (c-a)*uy + (a-b-c+d)*ux*uy;
}
function fbm(x, y, seed) { return noise(x*0.02, y*0.02, seed)*0.5 + noise(x*0.04, y*0.04, seed+100)*0.3 + noise(x*0.08, y*0.08, seed+200)*0.2; }

function getBiome(x, z) {
    var h = fbm(x, z, 1), m = fbm(x, z, 2);
    if (h > 0.6) return 'mountain';
    if (m > 0.55 && h < 0.35) return 'pond';
    if (m < 0.4) return 'grassland';
    return 'forest';
}

function isVillage(x, z) { return hash(Math.floor(x/150), Math.floor(z/150), 999) > 0.8; }

function genChunk(cx, cz) {
    var key = cx + ',' + cz;
    if (chunks[key]) return chunks[key];
    var data = new Uint8Array(CHUNK_SIZE * WORLD_HEIGHT * CHUNK_SIZE);
    var wx0 = cx * CHUNK_SIZE, wz0 = cz * CHUNK_SIZE;

    for (var lx = 0; lx < CHUNK_SIZE; lx++) {
        for (var lz = 0; lz < CHUNK_SIZE; lz++) {
            var wx = wx0 + lx, wz = wz0 + lz;
            var biome = getBiome(wx, wz);
            var hNoise = fbm(wx, wz, 1);
            var baseH = biome === 'mountain' ? SEA_LEVEL + Math.floor(hNoise * 20) :
                        biome === 'pond' ? SEA_LEVEL - 3 + Math.floor(hNoise * 4) :
                        SEA_LEVEL + Math.floor(hNoise * 8);

            for (var y = 0; y < WORLD_HEIGHT; y++) {
                var idx = lx + y * CHUNK_SIZE + lz * CHUNK_SIZE * WORLD_HEIGHT;
                if (y < baseH - 3) {
                    data[idx] = BLOCKS.STONE;
                    if (y < 20 && hash(wx, y + wz * 100, 777) > 0.95) data[idx] = BLOCKS.IRON_ORE;
                } else if (y < baseH) {
                    data[idx] = BLOCKS.DIRT;
                } else if (y === baseH) {
                    data[idx] = (biome === 'pond' && y < SEA_LEVEL - 1) ? BLOCKS.SAND : BLOCKS.GRASS;
                } else if (y <= SEA_LEVEL && biome === 'pond') {
                    data[idx] = BLOCKS.WATER;
                }
            }

            // Vegetation
            if (data[lx + baseH * CHUNK_SIZE + lz * CHUNK_SIZE * WORLD_HEIGHT] === BLOCKS.GRASS) {
                var vn = hash(wx * 3, wz * 3, 333);
                if (biome === 'forest' && vn > 0.88 && lx > 1 && lx < 14 && lz > 1 && lz < 14) {
                    var th = 4 + Math.floor(hash(wx, wz, 444) * 3);
                    for (var ty = 1; ty <= th; ty++) {
                        if (baseH + ty < WORLD_HEIGHT) data[lx + (baseH + ty) * CHUNK_SIZE + lz * CHUNK_SIZE * WORLD_HEIGHT] = BLOCKS.LOG;
                    }
                    for (var dx = -2; dx <= 2; dx++) for (var dz = -2; dz <= 2; dz++) for (var dy = -1; dy <= 1; dy++) {
                        if (Math.abs(dx) + Math.abs(dz) + Math.abs(dy) < 4) {
                            var nx = lx + dx, nz = lz + dz, ny = baseH + th + dy;
                            if (nx >= 0 && nx < 16 && nz >= 0 && nz < 16 && ny < WORLD_HEIGHT) {
                                var ni = nx + ny * CHUNK_SIZE + nz * CHUNK_SIZE * WORLD_HEIGHT;
                                if (data[ni] === 0) data[ni] = BLOCKS.LEAVES;
                            }
                        }
                    }
                } else if (vn > 0.5) {
                    if (baseH + 1 < WORLD_HEIGHT) data[lx + (baseH + 1) * CHUNK_SIZE + lz * CHUNK_SIZE * WORLD_HEIGHT] = vn > 0.7 ? (hash(wx, wz, 555) > 0.5 ? BLOCKS.FLOWER_RED : BLOCKS.FLOWER_YELLOW) : BLOCKS.TALL_GRASS;
                }
            }
        }
    }

    chunks[key] = data;

    // Village
    if (isVillage(wx0 + 8, wz0 + 8)) genVillage(cx, cz, data);

    // Mobs
    spawnMobs(cx, cz);

    return data;
}

function genVillage(cx, cz, data) {
    var wx0 = cx * CHUNK_SIZE, wz0 = cz * CHUNK_SIZE;
    var vcx = Math.floor(wx0 / 150) * 150 + 75, vcz = Math.floor(wz0 / 150) * 150 + 75;

    if (wx0 <= vcx && vcx < wx0 + 16 && wz0 <= vcz && vcz < wz0 + 16) {
        var houses = 6 + Math.floor(hash(vcx, vcz, 888) * 4);
        for (var h = 0; h < houses; h++) {
            var ang = h / houses * Math.PI * 2, dist = 6 + hash(h, vcx, 999) * 10;
            var hx = Math.floor(vcx + Math.cos(ang) * dist) - wx0;
            var hz = Math.floor(vcz + Math.sin(ang) * dist) - wz0;
            if (hx >= 2 && hx < 12 && hz >= 2 && hz < 12) {
                var gy = findGround(data, hx, hz);
                buildHouse(data, hx, gy, hz, hash(h, vcz, 111) > 0.7);
            }
        }
    }
}

function findGround(data, lx, lz) {
    for (var y = WORLD_HEIGHT - 1; y >= 0; y--) {
        var b = data[lx + y * CHUNK_SIZE + lz * CHUNK_SIZE * WORLD_HEIGHT];
        if (SOLID_BLOCKS[b]) return y;
    }
    return SEA_LEVEL;
}

function buildHouse(data, x, y, z, big) {
    var w = big ? 6 : 4, h = big ? 5 : 4, d = big ? 6 : 4;
    for (var hx = 0; hx < w; hx++) for (var hz = 0; hz < d; hz++) for (var hy = 0; hy <= h; hy++) {
        if (x + hx >= 16 || z + hz >= 16 || y + hy >= WORLD_HEIGHT) continue;
        var idx = (x + hx) + (y + hy) * CHUNK_SIZE + (z + hz) * CHUNK_SIZE * WORLD_HEIGHT;
        if (hy === 0 || hy === h) data[idx] = BLOCKS.PLANKS;
        else if (hx === 0 || hx === w-1 || hz === 0 || hz === d-1) data[idx] = (hy === 2 && (hx === w/2|0 || hz === d/2|0)) ? BLOCKS.GLASS : BLOCKS.PLANKS;
        else data[idx] = 0;
    }
    // Door
    var di = (x + (w/2|0)) + (y + 1) * CHUNK_SIZE + z * CHUNK_SIZE * WORLD_HEIGHT;
    if (x + (w/2|0) < 16) { data[di] = 0; data[di + CHUNK_SIZE] = 0; }
    // Crafting table
    if (x + 1 < 16 && z + 1 < 16) data[(x+1) + (y+1) * CHUNK_SIZE + (z+1) * CHUNK_SIZE * WORLD_HEIGHT] = BLOCKS.CRAFTING_TABLE;
}

function spawnMobs(cx, cz) {
    var wx0 = cx * CHUNK_SIZE, wz0 = cz * CHUNK_SIZE;
    var biome = getBiome(wx0 + 8, wz0 + 8);

    // Check if mobs already spawned in this chunk
    var key = cx + ',' + cz;
    for (var i = 0; i < mobs.length; i++) {
        var m = mobs[i];
        if (Math.floor(m.x / CHUNK_SIZE) === cx && Math.floor(m.z / CHUNK_SIZE) === cz) return;
    }

    if (biome === 'forest' || biome === 'grassland') {
        var pc = Math.floor(hash(cx, cz, 555) * 2);
        for (var i = 0; i < pc; i++) {
            var px = wx0 + hash(i, cx, 666) * 16, pz = wz0 + hash(i, cz, 777) * 16;
            mobs.push({ type:'pig', x:px, y:getGroundY(px, pz) + 1, z:pz, vx:0, vy:0, vz:0, hp:10, tx:px, tz:pz, timer:0 });
        }
    }

    if (hash(cx * 2, cz * 2, 888) > 0.9) {
        var zx = wx0 + hash(cx, cz, 123) * 16, zz = wz0 + hash(cz, cx, 321) * 16;
        mobs.push({ type:'zombie', x:zx, y:getGroundY(zx, zz) + 1, z:zz, vx:0, vy:0, vz:0, hp:20, atkCd:0 });
    }

    if (isVillage(wx0 + 8, wz0 + 8)) {
        var vc = 2 + Math.floor(hash(cx, cz, 999) * 3);
        for (var i = 0; i < vc; i++) {
            var vx = wx0 + 4 + hash(i * 2, cx, 111) * 8, vz = wz0 + 4 + hash(i * 2, cz, 222) * 8;
            mobs.push({ type:'villager', x:vx, y:getGroundY(vx, vz) + 1, z:vz, vx:0, vy:0, vz:0, hp:20, tx:vx, tz:vz, timer:0 });
        }
    }
}

function getBlock(x, y, z) {
    if (y < 0 || y >= WORLD_HEIGHT) return 0;
    var cx = Math.floor(x / CHUNK_SIZE), cz = Math.floor(z / CHUNK_SIZE);
    var chunk = chunks[cx + ',' + cz];
    if (!chunk) return 0;
    var lx = ((x % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
    var lz = ((z % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
    return chunk[lx + y * CHUNK_SIZE + lz * CHUNK_SIZE * WORLD_HEIGHT];
}

function setBlock(x, y, z, b) {
    if (y < 0 || y >= WORLD_HEIGHT) return;
    var cx = Math.floor(x / CHUNK_SIZE), cz = Math.floor(z / CHUNK_SIZE);
    var chunk = chunks[cx + ',' + cz];
    if (!chunk) return;
    var lx = ((x % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
    var lz = ((z % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
    chunk[lx + y * CHUNK_SIZE + lz * CHUNK_SIZE * WORLD_HEIGHT] = b;
}

function getGroundY(wx, wz) {
    var cx = Math.floor(wx / CHUNK_SIZE), cz = Math.floor(wz / CHUNK_SIZE);
    genChunk(cx, cz);
    for (var y = WORLD_HEIGHT - 1; y >= 0; y--) {
        var b = getBlock(Math.floor(wx), y, Math.floor(wz));
        if (SOLID_BLOCKS[b]) return y;
    }
    return SEA_LEVEL;
}

// Camera
function camTransform(px, py, pz) {
    var dx = px - player.x, dy = py - player.y - 1.6, dz = pz - player.z;
    var cy = Math.cos(-player.yaw), sy = Math.sin(-player.yaw);
    var cp = Math.cos(-player.pitch), sp = Math.sin(-player.pitch);
    var x1 = dx * cy - dz * sy, z1 = dx * sy + dz * cy;
    return { x: x1, y: dy * cp - z1 * sp, z: dy * sp + z1 * cp };
}

function project(cam) {
    if (cam.z < 0.2) return null;
    var f = 350 / cam.z;
    return { x: cam.x * f + canvas.width / 2, y: -cam.y * f + canvas.height / 2, z: cam.z };
}

// Rendering
function render() {
    // Sky
    ctx.fillStyle = '#6af';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#8cf';
    ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

    var px = Math.floor(player.x), py = Math.floor(player.y), pz = Math.floor(player.z);
    var renderList = [];

    // Collect visible blocks
    for (var x = px - RENDER_DIST; x <= px + RENDER_DIST; x++) {
        for (var z = pz - RENDER_DIST; z <= pz + RENDER_DIST; z++) {
            for (var y = Math.max(0, py - 15); y < Math.min(WORLD_HEIGHT, py + 15); y++) {
                var b = getBlock(x, y, z);
                if (b === 0 || b === BLOCKS.WATER) continue;

                // Check if any face visible
                var visible = !SOLID_BLOCKS[getBlock(x, y+1, z)] || !SOLID_BLOCKS[getBlock(x, y-1, z)] ||
                              !SOLID_BLOCKS[getBlock(x+1, y, z)] || !SOLID_BLOCKS[getBlock(x-1, y, z)] ||
                              !SOLID_BLOCKS[getBlock(x, y, z+1)] || !SOLID_BLOCKS[getBlock(x, y, z-1)];
                if (!visible) continue;

                var dx = x + 0.5 - player.x, dy = y + 0.5 - player.y, dz = z + 0.5 - player.z;
                renderList.push({ type: 'block', x: x, y: y, z: z, block: b, dist: dx*dx + dy*dy + dz*dz });
            }
        }
    }

    // Add mobs
    for (var i = 0; i < mobs.length; i++) {
        var m = mobs[i];
        var dx = m.x - player.x, dy = m.y - player.y, dz = m.z - player.z;
        var dist = dx*dx + dy*dy + dz*dz;
        if (dist < RENDER_DIST * RENDER_DIST) {
            renderList.push({ type: 'mob', mob: m, dist: dist });
        }
    }

    // Add drops
    for (var i = 0; i < drops.length; i++) {
        var d = drops[i];
        var dx = d.x - player.x, dy = d.y - player.y, dz = d.z - player.z;
        renderList.push({ type: 'drop', drop: d, dist: dx*dx + dy*dy + dz*dz });
    }

    // Sort far to near
    renderList.sort(function(a, b) { return b.dist - a.dist; });

    // Draw
    for (var i = 0; i < renderList.length; i++) {
        var item = renderList[i];
        if (item.type === 'block') drawBlock(item.x, item.y, item.z, item.block);
        else if (item.type === 'mob') drawMob(item.mob);
        else if (item.type === 'drop') drawDrop(item.drop);
    }
}

function drawFace(verts, color, shade) {
    var proj = [];
    for (var i = 0; i < verts.length; i++) {
        var c = camTransform(verts[i][0], verts[i][1], verts[i][2]);
        var p = project(c);
        if (!p) return;
        proj.push(p);
    }

    // Backface cull
    var ax = proj[1].x - proj[0].x, ay = proj[1].y - proj[0].y;
    var bx = proj[2].x - proj[0].x, by = proj[2].y - proj[0].y;
    if (ax * by - ay * bx > 0) return;

    var r = parseInt(color.slice(1, 2), 16) * 17;
    var g = parseInt(color.slice(2, 3), 16) * 17;
    var b = parseInt(color.slice(3, 4), 16) * 17;
    ctx.fillStyle = 'rgb(' + Math.floor(r * shade) + ',' + Math.floor(g * shade) + ',' + Math.floor(b * shade) + ')';
    ctx.beginPath();
    ctx.moveTo(proj[0].x, proj[0].y);
    for (var i = 1; i < proj.length; i++) ctx.lineTo(proj[i].x, proj[i].y);
    ctx.closePath();
    ctx.fill();
}

function drawBlock(x, y, z, b) {
    var c = BLOCK_COLORS[b];
    if (!c) return;

    // Top
    if (!SOLID_BLOCKS[getBlock(x, y+1, z)]) drawFace([[x,y+1,z],[x+1,y+1,z],[x+1,y+1,z+1],[x,y+1,z+1]], c, 1.0);
    // Bottom
    if (!SOLID_BLOCKS[getBlock(x, y-1, z)]) drawFace([[x,y,z+1],[x+1,y,z+1],[x+1,y,z],[x,y,z]], c, 0.5);
    // Front
    if (!SOLID_BLOCKS[getBlock(x, y, z+1)]) drawFace([[x,y,z+1],[x,y+1,z+1],[x+1,y+1,z+1],[x+1,y,z+1]], c, 0.7);
    // Back
    if (!SOLID_BLOCKS[getBlock(x, y, z-1)]) drawFace([[x+1,y,z],[x+1,y+1,z],[x,y+1,z],[x,y,z]], c, 0.7);
    // Right
    if (!SOLID_BLOCKS[getBlock(x+1, y, z)]) drawFace([[x+1,y,z+1],[x+1,y+1,z+1],[x+1,y+1,z],[x+1,y,z]], c, 0.8);
    // Left
    if (!SOLID_BLOCKS[getBlock(x-1, y, z)]) drawFace([[x,y,z],[x,y+1,z],[x,y+1,z+1],[x,y,z+1]], c, 0.6);
}

function drawMob(m) {
    var c = m.type === 'zombie' ? '#595' : m.type === 'pig' ? '#faa' : '#a86';
    var w = 0.4, h = m.type === 'pig' ? 0.6 : 1.6, d = m.type === 'pig' ? 0.8 : 0.4;
    var x = m.x, y = m.y, z = m.z;

    drawFace([[x-w,y+h,z-d],[x+w,y+h,z-d],[x+w,y+h,z+d],[x-w,y+h,z+d]], c, 1.0);
    drawFace([[x-w,y,z+d],[x+w,y,z+d],[x+w,y,z-d],[x-w,y,z-d]], c, 0.5);
    drawFace([[x-w,y,z+d],[x-w,y+h,z+d],[x+w,y+h,z+d],[x+w,y,z+d]], c, 0.7);
    drawFace([[x+w,y,z-d],[x+w,y+h,z-d],[x-w,y+h,z-d],[x-w,y,z-d]], c, 0.7);
    drawFace([[x+w,y,z+d],[x+w,y+h,z+d],[x+w,y+h,z-d],[x+w,y,z-d]], c, 0.8);
    drawFace([[x-w,y,z-d],[x-w,y+h,z-d],[x-w,y+h,z+d],[x-w,y,z+d]], c, 0.6);
}

function drawDrop(d) {
    var cam = camTransform(d.x, d.y + 0.2, d.z);
    var p = project(cam);
    if (p) {
        ctx.fillStyle = ITEM_COLORS[d.item] || '#fff';
        var s = Math.max(4, 12 - p.z);
        ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
    }
}

// Raycast
function raycast(maxDist) {
    var dx = -Math.sin(player.yaw) * Math.cos(player.pitch);
    var dy = Math.sin(player.pitch);
    var dz = Math.cos(player.yaw) * Math.cos(player.pitch);

    var prevX, prevY, prevZ;
    for (var t = 0; t < maxDist; t += 0.05) {
        var x = Math.floor(player.x + dx * t);
        var y = Math.floor(player.y + 1.6 + dy * t);
        var z = Math.floor(player.z + dz * t);

        var b = getBlock(x, y, z);
        if (SOLID_BLOCKS[b]) {
            return { x: x, y: y, z: z, block: b, px: prevX, py: prevY, pz: prevZ };
        }
        prevX = x; prevY = y; prevZ = z;
    }
    return null;
}

// Mining
function getMineTime(b) {
    var tool = player.inventory[player.slot];
    var tt = tool ? tool.item : null;
    var base = (b === BLOCKS.STONE || b === BLOCKS.IRON_ORE) ? 2.0 : (b === BLOCKS.LOG) ? 1.5 : 0.5;
    var mult = 1;

    if (b === BLOCKS.LOG || b === BLOCKS.PLANKS || b === BLOCKS.CRAFTING_TABLE) {
        if (tt === 'wood_axe') mult = 2; else if (tt === 'stone_axe') mult = 3; else if (tt === 'iron_axe') mult = 5;
    } else if (b === BLOCKS.STONE || b === BLOCKS.IRON_ORE) {
        if (tt === 'wood_pickaxe') mult = 2; else if (tt === 'stone_pickaxe') mult = 3; else if (tt === 'iron_pickaxe') mult = 5;
    }
    return base / mult;
}

function canDrop(b) {
    var tool = player.inventory[player.slot];
    var tt = tool ? tool.item : null;
    if (b === BLOCKS.STONE) return tt === 'wood_pickaxe' || tt === 'stone_pickaxe' || tt === 'iron_pickaxe';
    if (b === BLOCKS.IRON_ORE) return tt === 'stone_pickaxe' || tt === 'iron_pickaxe';
    return true;
}

function getDropItem(b) {
    if (b === 4 || b === 12) return 'wood';  // LOG, PLANKS
    if (b === 3) return 'stone';  // STONE
    if (b === 8) return 'iron';   // IRON_ORE
    if (b === 2 || b === 1) return 'dirt';  // DIRT, GRASS
    if (b === 9 || b === 10) return 'flower';  // FLOWERS
    if (b === 13) return 'crafting_table';  // CRAFTING_TABLE
    if (b === 5) return 'wood';   // LEAVES also drops wood
    return null;
}

function mine(target) {
    if (!target) { miningTarget = null; miningTime = 0; return; }

    if (!miningTarget || miningTarget.x !== target.x || miningTarget.y !== target.y || miningTarget.z !== target.z) {
        miningTarget = { x: target.x, y: target.y, z: target.z };
        miningTime = 0;
    }

    var needed = getMineTime(target.block);
    miningTime += 1/60;

    document.getElementById('mining-bar').style.display = 'block';
    document.getElementById('mining-progress').style.width = (miningTime / needed * 100) + '%';

    if (miningTime >= needed) {
        if (canDrop(target.block)) {
            var dropItem = getDropItem(target.block);
            if (dropItem) drops.push({ item: dropItem, count: 1, x: target.x + 0.5, y: target.y + 0.5, z: target.z + 0.5, vy: 0.1 });
        }
        setBlock(target.x, target.y, target.z, 0);
        miningTarget = null;
        miningTime = 0;
        document.getElementById('mining-bar').style.display = 'none';
    }
}

// Attack
function attack() {
    var tool = player.inventory[player.slot];
    var dmg = 1;
    if (tool) {
        if (tool.item === 'wood_sword') dmg = 4;
        else if (tool.item === 'stone_sword') dmg = 6;
        else if (tool.item === 'iron_sword') dmg = 8;
        else if (tool.item === 'akm') dmg = 20;
    }

    var range = (tool && tool.item === 'akm') ? 25 : 4;
    var dx = -Math.sin(player.yaw) * Math.cos(player.pitch);
    var dy = Math.sin(player.pitch);
    var dz = Math.cos(player.yaw) * Math.cos(player.pitch);

    for (var i = 0; i < mobs.length; i++) {
        var m = mobs[i];
        var mx = m.x - player.x, my = m.y + 0.8 - player.y - 1.6, mz = m.z - player.z;
        var dist = Math.sqrt(mx*mx + my*my + mz*mz);
        if (dist < range && dist > 0) {
            var dot = (mx*dx + my*dy + mz*dz) / dist;
            if (dot > 0.7) {
                m.hp -= dmg;
                m.vx = dx * 0.3; m.vz = dz * 0.3; m.vy = 0.15;
                if (m.hp <= 0) {
                    if (m.type === 'pig') {
                        var pc = 2 + Math.floor(Math.random() * 2);
                        for (var j = 0; j < pc; j++) {
                            drops.push({ item: 'pork', count: 1, x: m.x + (Math.random()-0.5)*0.5, y: m.y + 0.5, z: m.z + (Math.random()-0.5)*0.5, vy: 0.12 });
                        }
                    }
                    mobs.splice(i, 1);
                }
                return true;
            }
        }
    }
    return false;
}

// Place block
function placeBlock(target) {
    if (!target || target.py === undefined) return;
    var sel = player.inventory[player.slot];
    if (!sel) return;

    var blockToPlace = null;
    if (sel.item === 'wood') blockToPlace = BLOCKS.PLANKS;
    else if (sel.item === 'stone') blockToPlace = BLOCKS.STONE;
    else if (sel.item === 'iron') blockToPlace = BLOCKS.IRON_ORE;
    else if (sel.item === 'dirt') blockToPlace = BLOCKS.DIRT;
    else if (sel.item === 'crafting_table') blockToPlace = BLOCKS.CRAFTING_TABLE;
    else if (sel.item === 'flower') blockToPlace = BLOCKS.FLOWER_RED;

    if (blockToPlace !== null) {
        // Check not placing in player
        var px = Math.floor(player.x), py = Math.floor(player.y), pz = Math.floor(player.z);
        if (target.px === px && target.pz === pz && (target.py === py || target.py === py + 1)) return;

        setBlock(target.px, target.py, target.pz, blockToPlace);
        removeItem(sel.item, 1);
        updateHotbar();
    }
}

// Inventory
function addItem(item, count) {
    for (var i = 0; i < player.inventory.length; i++) {
        if (player.inventory[i] && player.inventory[i].item === item) {
            player.inventory[i].count += count;
            return true;
        }
    }
    for (var i = 0; i < player.inventory.length; i++) {
        if (!player.inventory[i]) {
            player.inventory[i] = { item: item, count: count };
            return true;
        }
    }
    return false;
}

function removeItem(item, count) {
    for (var i = 0; i < player.inventory.length; i++) {
        if (player.inventory[i] && player.inventory[i].item === item) {
            player.inventory[i].count -= count;
            if (player.inventory[i].count <= 0) player.inventory[i] = null;
            return true;
        }
    }
    return false;
}

function countItem(item) {
    var t = 0;
    for (var i = 0; i < player.inventory.length; i++) {
        if (player.inventory[i] && player.inventory[i].item === item) t += player.inventory[i].count;
    }
    return t;
}

function canCraft(r) {
    if (r.needsTable && !player.nearTable) return false;
    for (var k in r.cost) if (countItem(k) < r.cost[k]) return false;
    return true;
}

function craft(r) {
    if (!canCraft(r)) return;
    for (var k in r.cost) removeItem(k, r.cost[k]);
    addItem(r.result, r.count);
    updateHotbar();
    updateInvUI();
}

// Physics
function update() {
    if (invOpen) return;

    var mx = 0, mz = 0;
    if (keys['KeyW']) mz = 1;
    if (keys['KeyS']) mz = -1;
    if (keys['KeyA']) mx = -1;
    if (keys['KeyD']) mx = 1;

    var spd = 0.06;
    var cy = Math.cos(player.yaw), sy = Math.sin(player.yaw);
    player.vx += (mx * cy - mz * sy) * spd;
    player.vz += (mx * sy + mz * cy) * spd;
    player.vy -= 0.012;

    if (keys['Space'] && player.onGround) {
        player.vy = 0.2;
        player.onGround = false;
    }

    player.vx *= 0.8;
    player.vz *= 0.8;

    // Collision
    var nx = player.x + player.vx;
    var ny = player.y + player.vy;
    var nz = player.z + player.vz;

    if (collide(nx, player.y, player.z)) { player.vx = 0; nx = player.x; }
    if (collide(nx, player.y, nz)) { player.vz = 0; nz = player.z; }

    player.onGround = false;
    if (collide(nx, ny, nz)) {
        if (player.vy < 0) { player.onGround = true; ny = Math.floor(player.y); }
        player.vy = 0;
    }

    player.x = nx; player.y = ny; player.z = nz;

    // Near crafting table?
    player.nearTable = false;
    for (var dx = -2; dx <= 2; dx++) for (var dy = -2; dy <= 2; dy++) for (var dz = -2; dz <= 2; dz++) {
        if (getBlock(Math.floor(player.x) + dx, Math.floor(player.y) + dy, Math.floor(player.z) + dz) === BLOCKS.CRAFTING_TABLE) {
            player.nearTable = true;
        }
    }

    // Pickup drops
    for (var i = drops.length - 1; i >= 0; i--) {
        var d = drops[i];
        d.vy -= 0.008;
        d.y += d.vy;
        var gy = getGroundY(d.x, d.z) + 1;
        if (d.y < gy) { d.y = gy; d.vy = 0; }

        var dx = d.x - player.x, dy = d.y - player.y - 1, dz = d.z - player.z;
        if (dx*dx + dy*dy + dz*dz < 1.5) {
            if (addItem(d.item, d.count)) {
                drops.splice(i, 1);
                updateHotbar();
            }
        }
    }

    // Update mobs
    updateMobs();

    // Mining
    if (mouseLeft && mouseLocked) {
        var target = raycast(5);
        if (target) {
            mine(target);
        } else {
            attack();
            miningTarget = null;
            miningTime = 0;
            document.getElementById('mining-bar').style.display = 'none';
        }
    } else {
        miningTarget = null;
        miningTime = 0;
        document.getElementById('mining-bar').style.display = 'none';
    }

    document.getElementById('pos').textContent = Math.floor(player.x) + ',' + Math.floor(player.y) + ',' + Math.floor(player.z);
    document.getElementById('biome').textContent = getBiome(player.x, player.z);
}

function collide(x, y, z) {
    var r = 0.25;
    for (var bx = Math.floor(x - r); bx <= Math.floor(x + r); bx++) {
        for (var by = Math.floor(y); by <= Math.floor(y + 1.7); by++) {
            for (var bz = Math.floor(z - r); bz <= Math.floor(z + r); bz++) {
                if (SOLID_BLOCKS[getBlock(bx, by, bz)]) return true;
            }
        }
    }
    return false;
}

function updateMobs() {
    for (var i = 0; i < mobs.length; i++) {
        var m = mobs[i];
        m.vy -= 0.012;

        if (m.type === 'zombie') {
            var dx = player.x - m.x, dz = player.z - m.z;
            var dist = Math.sqrt(dx*dx + dz*dz);
            if (dist < 15 && dist > 0.8) {
                m.vx += (dx / dist) * 0.015;
                m.vz += (dz / dist) * 0.015;
            }
            if (dist < 1.2 && m.atkCd <= 0) {
                player.health -= 2;
                updateHealth();
                m.atkCd = 40;
                if (player.health <= 0) {
                    showMsg('You Died!');
                    setTimeout(function() { hideMsg(); respawn(); }, 2000);
                }
            }
            m.atkCd--;
        } else {
            m.timer--;
            if (m.timer <= 0) {
                m.tx = m.x + (Math.random() - 0.5) * 8;
                m.tz = m.z + (Math.random() - 0.5) * 8;
                m.timer = 60 + Math.random() * 120;
            }
            var dx = m.tx - m.x, dz = m.tz - m.z;
            var dist = Math.sqrt(dx*dx + dz*dz);
            if (dist > 0.3) {
                m.vx += (dx / dist) * 0.004;
                m.vz += (dz / dist) * 0.004;
            }
        }

        m.vx *= 0.85; m.vz *= 0.85;
        m.x += m.vx; m.y += m.vy; m.z += m.vz;

        var gy = getGroundY(m.x, m.z) + 1;
        if (m.y < gy) { m.y = gy; m.vy = 0; }
    }
}

function respawn() {
    player.x = 0; player.y = 20; player.z = 0;
    player.health = player.maxHealth;
    updateHealth();
}

// UI
function updateHotbar() {
    var hb = document.getElementById('hotbar');
    hb.innerHTML = '';
    for (var i = 0; i < 9; i++) {
        var s = document.createElement('div');
        s.className = 'slot' + (i === player.slot ? ' selected' : '');
        var it = player.inventory[i];
        if (it) {
            s.style.background = ITEM_COLORS[it.item] || '#666';
            s.innerHTML = '<span style="font-size:8px">' + (ITEM_NAMES[it.item] || it.item) + '</span><span class="slot-count">' + it.count + '</span>';
        }
        hb.appendChild(s);
    }
}

function updateHealth() {
    var hb = document.getElementById('health-bar');
    hb.innerHTML = '';
    for (var i = 0; i < player.maxHealth; i++) {
        var h = document.createElement('div');
        h.className = 'heart' + (i >= player.health ? ' empty' : '');
        hb.appendChild(h);
    }
}

function updateInvUI() {
    var grid = document.getElementById('inv-grid');
    grid.innerHTML = '';
    for (var i = 0; i < 36; i++) {
        var s = document.createElement('div');
        s.className = 'slot';
        var it = player.inventory[i];
        if (it) {
            s.style.background = ITEM_COLORS[it.item] || '#666';
            s.innerHTML = '<span style="font-size:8px">' + (ITEM_NAMES[it.item] || it.item) + '</span><span class="slot-count">' + it.count + '</span>';
        }
        grid.appendChild(s);
    }

    var cb = document.getElementById('craft-buttons');
    cb.innerHTML = '';
    for (var i = 0; i < RECIPES.length; i++) {
        var r = RECIPES[i];
        var btn = document.createElement('button');
        btn.className = 'craft-btn';
        btn.disabled = !canCraft(r);
        var cost = '';
        for (var k in r.cost) cost += r.cost[k] + k.charAt(0).toUpperCase() + ' ';
        btn.textContent = ITEM_NAMES[r.result] + ' (' + cost.trim() + ')' + (r.needsTable ? '*' : '');
        (function(recipe) { btn.onclick = function() { craft(recipe); }; })(r);
        cb.appendChild(btn);
    }
}

function showMsg(t) { document.getElementById('message').textContent = t; document.getElementById('message').style.display = 'block'; }
function hideMsg() { document.getElementById('message').style.display = 'none'; }

// Input
document.addEventListener('keydown', function(e) {
    keys[e.code] = true;
    if (e.code === 'KeyE') {
        invOpen = !invOpen;
        document.getElementById('inventory').style.display = invOpen ? 'block' : 'none';
        if (invOpen) { document.exitPointerLock(); updateInvUI(); }
        else canvas.requestPointerLock();
    }
    if (e.code >= 'Digit1' && e.code <= 'Digit9') {
        player.slot = parseInt(e.code.charAt(5)) - 1;
        updateHotbar();
    }
    if (e.code === 'Space') e.preventDefault();
});

document.addEventListener('keyup', function(e) { keys[e.code] = false; });

canvas.addEventListener('mousedown', function(e) {
    if (!mouseLocked) { canvas.requestPointerLock(); return; }
    if (e.button === 0) {
        mouseLeft = true;
        attack(); // Try attack immediately
    }
    if (e.button === 2) {
        mouseRight = true;
        var target = raycast(5);
        if (target) {
            if (target.block === BLOCKS.CRAFTING_TABLE) {
                invOpen = true;
                document.getElementById('inventory').style.display = 'block';
                document.exitPointerLock();
                updateInvUI();
            } else {
                placeBlock(target);
            }
        } else {
            // Eat pork
            var sel = player.inventory[player.slot];
            if (sel && sel.item === 'pork' && player.health < player.maxHealth) {
                player.health = Math.min(player.maxHealth, player.health + 3);
                removeItem('pork', 1);
                updateHealth();
                updateHotbar();
            }
        }
    }
});

canvas.addEventListener('mouseup', function(e) {
    if (e.button === 0) mouseLeft = false;
    if (e.button === 2) mouseRight = false;
});

canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

document.addEventListener('pointerlockchange', function() {
    mouseLocked = document.pointerLockElement === canvas;
});

document.addEventListener('mousemove', function(e) {
    if (!mouseLocked || invOpen) return;
    player.yaw -= e.movementX * 0.002;
    player.pitch += e.movementY * 0.002;
    player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
});

window.addEventListener('resize', function() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// Generate chunks around player
function genNearby() {
    var cx = Math.floor(player.x / CHUNK_SIZE), cz = Math.floor(player.z / CHUNK_SIZE);
    for (var dx = -2; dx <= 2; dx++) {
        for (var dz = -2; dz <= 2; dz++) {
            genChunk(cx + dx, cz + dz);
        }
    }
}

// Main loop
function gameLoop() {
    genNearby();
    update();
    render();
    updateHotbar();
    requestAnimationFrame(gameLoop);
}

// Init
function init() {
    genNearby();
    player.y = getGroundY(0, 0) + 2;
    updateHotbar();
    updateHealth();
    gameLoop();
}

init();
</script>
</body>
