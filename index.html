<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cube Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        #canvas {
            border: 2px solid rgba(0, 200, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.2);
            cursor: grab;
        }

        #canvas:active {
            cursor: grabbing;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 600px;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .control-group h3 {
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #00c8ff;
        }

        button {
            background: linear-gradient(135deg, #00c8ff 0%, #0080ff 100%);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 2px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 200, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .info {
            margin-top: 15px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            padding: 0;
        }
    </style>
</head>
<body>
    <h1>🎮 3D Cube Viewer</h1>
    <canvas id="canvas" width="600" height="500"></canvas>

    <div class="controls">
        <div class="control-group">
            <h3>🎯 視点プリセット</h3>
            <button onclick="setView('front')">正面</button>
            <button onclick="setView('top')">上から</button>
            <button onclick="setView('side')">横から</button>
            <button onclick="setView('corner')">斜め</button>
            <button onclick="setView('iso')">アイソメトリック</button>
        </div>

        <div class="control-group">
            <h3>⚙️ 操作</h3>
            <button onclick="toggleAutoRotate()">自動回転 ON/OFF</button>
            <button onclick="resetRotation()">リセット</button>
            <button onclick="toggleWireframe()">ワイヤーフレーム</button>
        </div>

        <div class="control-group">
            <h3>🎨 カラー</h3>
            <button class="color-btn" style="background: #ff6b6b;" onclick="setColor('#ff6b6b')"></button>
            <button class="color-btn" style="background: #4ecdc4;" onclick="setColor('#4ecdc4')"></button>
            <button class="color-btn" style="background: #ffe66d;" onclick="setColor('#ffe66d')"></button>
            <button class="color-btn" style="background: #95e1d3;" onclick="setColor('#95e1d3')"></button>
            <button class="color-btn" style="background: #f38181;" onclick="setColor('#f38181')"></button>
            <button class="color-btn" style="background: #aa96da;" onclick="setColor('#aa96da')"></button>
        </div>
    </div>

    <div class="info">
        🖱️ ドラッグで回転 | 🎡 スクロールでズーム | ⌨️ 矢印キーでも回転可能
    </div>

    <div class="stats" id="stats">
        <div>X回転: <span id="rotX">0</span>°</div>
        <div>Y回転: <span id="rotY">0</span>°</div>
        <div>ズーム: <span id="zoom">100</span>%</div>
    </div>

    <script src="cube.js"></script>
</body>
</html>
